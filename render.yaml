services:
  - type: web
    name: water-access-mapper-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OSRM_BASE_URL
        value: http://router.project-osrm.org
      - key: PYTHON_VERSION
        value: "3.11"
